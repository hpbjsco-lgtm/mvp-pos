# Apache reverse proxy for the MVP POS container.
#
# Required modules (httpd.conf): mod_proxy and mod_proxy_http
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#
# Put these lines inside the existing <VirtualHost *:443> of pos.hp-backup.com and remove the
# DocumentRoot / <Directory> block that pointed to the dist folder: the container now serves the
# web app (/), the SQL API (/api) and the admin page (/admin) itself.

ProxyPreserveHost On
ProxyTimeout 120

ProxyPass        / http://127.0.0.1:8790/
ProxyPassReverse / http://127.0.0.1:8790/

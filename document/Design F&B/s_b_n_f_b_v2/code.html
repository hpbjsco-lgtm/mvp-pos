</label>

<script>
  document.getElementById('design-mode-toggle').addEventListener('change', function(e) {
    const container = document.getElementById('table-map-container');
    const tables = container.querySelectorAll('button');
    
    if(e.target.checked) {
      container.classList.add('bg-[linear-gradient(rgba(0,0,0,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(0,0,0,0.05)_1px,transparent_1px)]', 'bg-[size:20px_20px]');
      tables.forEach(table => {
        table.classList.add('animate-pulse', 'border-dashed', 'border-2', 'border-primary');
        table.classList.remove('active:scale-95');
      });
    } else {
      container.classList.remove('bg-[linear-gradient(rgba(0,0,0,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(0,0,0,0.05)_1px,transparent_1px)]', 'bg-[size:20px_20px]');
      tables.forEach(table => {
        table.classList.remove('animate-pulse', 'border-dashed', 'border-2', 'border-primary');
        table.classList.add('active:scale-95');
      });
    }
  });

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#ffdcc3", "secondary-fixed": "#7efba4", "primary-fixed": "#cee5ff", "surface": "#f8f9fa", "on-background": "#191c1d", "outline-variant": "#c0c7d1", "on-surface": "#191c1d", "on-surface-variant": "#404750", "on-secondary-fixed-variant": "#005228", "primary": "#005889", "secondary": "#006d37", "secondary-fixed-dim": "#61de8a", "surface-container-lowest": "#ffffff", "background": "#f8f9fa", "primary-fixed-dim": "#96ccff", "surface-container-high": "#e7e8e9", "inverse-primary": "#96ccff", "tertiary": "#804400", "on-error-container": "#93000a", "primary-container": "#0071af", "on-tertiary-fixed-variant": "#6e3900", "on-secondary-fixed": "#00210c", "tertiary-fixed-dim": "#ffb77d", "outline": "#707881", "on-secondary-container": "#007239", "error": "#ba1a1a", "on-tertiary-fixed": "#2f1500", "surface-dim": "#d9dadb", "on-secondary": "#ffffff", "error-container": "#ffdad6", "inverse-on-surface": "#f0f1f2", "on-primary-fixed-variant": "#004a75", "surface-bright": "#f8f9fa", "on-tertiary-container": "#ffeadc", "on-primary": "#ffffff", "on-error": "#ffffff", "on-primary-container": "#e3efff", "surface-tint": "#00639a", "inverse-surface": "#2e3132", "surface-container": "#edeeef", "on-primary-fixed": "#001d32", "surface-container-low": "#f3f4f5", "tertiary-container": "#a25909", "on-tertiary": "#ffffff", "secondary-container": "#7bf8a1", "surface-variant": "#e1e3e4", "surface-container-highest": "#e1e3e4" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "stack-sm": "8px", "stack-lg": "24px", "stack-md": "16px", "margin-mobile": "16px", "gutter": "16px", "touch-target-min": "48px" }, "fontFamily": { "button-text": [" </head><body class="bg-background font-body-md text-on-surface"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between gap-stack-md"><div class="flex items-center gap-stack-md"><button class="w-10 h-10 -ml-2 flex items-center justify-center text-primary" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Checkout</h1></div><div class="flex items-center"><img alt="POS Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida/AEtjO1XS-bLWx6W3qZZ3SQdOM6M_GmAJJ7zWsfIAJaIBrBrXcVFlIB3FSEkm7rM3fE0mBKzSZDRbW-yUbBmRbSra_UqXLyFncssBY_Wya5ZKQSpBqlIC-eYSef2aeaDNtLLNhLaSVFd7siq2ImedSNIOD3oS772nEYR09gSuAjWLlv65fYGtilUemaB7wdYIsFkfvI5wzIcONAa6LppwJegFRdvFIHHZzi1azR0CG-s37ZCaD10r8zCz1_GS0Sw"/></div></div></header><main class="relative w-full pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full pb-safe" id="checkout-container">
<!-- Header Summary Section -->
<section class="bg-surface-container-low px-gutter py-stack-lg shadow-sm">
<div class="flex justify-between items-center mb-stack-sm">
<span class="font-body-lg text-on-surface-variant">Tổng thanh toán</span>
<span class="font-label-bold text-primary flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">receipt_long</span>
                3 món
            </span>
</div>
<div class="text-[40px] leading-[48px] font-bold text-on-surface tracking-tight mb-stack-md" id="grand-total-display">
            285,000 đ
        </div>
<div class="flex items-center gap-stack-sm bg-surface-container-high rounded-xl p-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">loyalty</span>
</div>
<div class="flex-1 min-w-0">
<div class="font-label-bold text-on-surface truncate">Thành viên Hạng Bạc</div>
<div class="font-body-md text-on-surface-variant text-[14px]">Tích lũy: +28 điểm</div>
</div>
<button class="px-3 py-1.5 rounded-lg bg-surface text-primary font-label-bold text-[14px] shadow-sm">Áp dụng</button>
</div>
</section>
<!-- Payment Methods -->
<section class="px-gutter py-stack-lg">
<h2 class="font-headline-md text-on-surface mb-stack-md">Phương thức thanh toán</h2>
<div class="grid grid-cols-3 gap-stack-md" id="payment-methods">
<button class="payment-method-btn flex flex-col items-center justify-center p-stack-md rounded-xl bg-primary-container text-on-primary-container shadow-sm transition-all relative overflow-hidden" data-method="cash">
<span class="material-symbols-outlined text-[32px] mb-2" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-bold text-center">Tiền mặt</span>
<!-- Active indicator -->
<div class="absolute inset-0 bg-primary/10 rounded-xl opacity-0 active-overlay transition-opacity"></div>
</button>
<button class="payment-method-btn flex flex-col items-center justify-center p-stack-md rounded-xl bg-surface-container text-on-surface-variant shadow-sm transition-all" data-method="qr"><span class="material-symbols-outlined text-[32px] mb-2">qr_code_scanner</span><span class="font-label-bold text-center">Quét mã QR</span></button>
<button class="payment-method-btn flex flex-col items-center justify-center p-stack-md rounded-xl bg-surface-container text-on-surface-variant shadow-sm transition-all" data-method="card"><span class="material-symbols-outlined text-[32px] mb-2">credit_card</span><span class="font-label-bold text-center">Thẻ ngân hàng</span></button>
</div>
</section>
<!-- Cash Input Section (Dynamic) -->
<section class="px-gutter py-stack-md transition-all duration-300 transform origin-top" id="cash-input-section">
<div class="flex justify-between items-center mb-stack-sm">
<label class="font-headline-md text-on-surface text-[18px]">Khách đưa</label>
</div>
<!-- Input Field -->
<div class="relative mb-stack-md group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-headline-lg text-on-surface-variant">đ</span>
<input class="w-full bg-surface-container-lowest h-16 rounded-xl pl-12 pr-4 font-headline-lg text-right text-on-surface focus:outline-none focus:ring-2 focus:ring-primary shadow-sm transition-shadow" id="cash-input" inputmode="numeric" placeholder="0" type="text" value="300,000"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-0 group-focus-within:opacity-100 transition-opacity p-2 hidden" id="clear-cash">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Quick Amount Suggestions -->
<div class="grid grid-cols-4 gap-2 mb-stack-lg" id="quick-amounts">
<button class="quick-btn py-2 px-1 rounded-lg bg-surface-container-high text-on-surface font-label-bold text-[14px]" data-val="285000">Vừa đủ</button>
<button class="quick-btn py-2 px-1 rounded-lg bg-surface-container-high text-on-surface font-label-bold text-[14px]" data-val="300000">300k</button>
<button class="quick-btn py-2 px-1 rounded-lg bg-surface-container-high text-on-surface font-label-bold text-[14px]" data-val="500000">500k</button>
<button class="quick-btn py-2 px-1 rounded-lg bg-surface-container-high text-on-surface font-label-bold text-[14px]" data-val="1000000">1,000k</button>
</div>
<!-- Change Calculation -->
<div class="bg-tertiary-fixed rounded-xl p-stack-md flex justify-between items-center shadow-sm">
<div class="flex items-center gap-2 text-on-tertiary-fixed">
<span class="material-symbols-outlined">currency_exchange</span>
<span class="font-label-bold text-[16px]">Tiền thừa trả khách</span>
</div>
<div class="font-headline-lg text-on-tertiary-fixed" id="change-display">15,000 đ</div>
</div>
</section>
<!-- Sticky Footer Action -->
<div class="fixed left-0 right-0 bg-surface-container-lowest shadow-[0_-4px_16px_rgba(0,0,0,0.05)] pb-safe pt-stack-md px-gutter z-40 transition-transform duration-300 bottom-16" id="checkout-footer">
<button class="w-full h-14 bg-secondary text-on-secondary rounded-xl font-button-text shadow-md flex items-center justify-center gap-2 active:scale-[0.98] transition-transform" id="complete-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Hoàn tất thanh toán
        </button>
<div class="h-4"></div> <!-- Extra padding for modern iOS home bar if needed beyond pb-safe -->
</div><nav class="fixed bottom-0 left-0 right-0 bg-surface-container-lowest border-t border-outline-variant z-50 pb-safe"><div class="flex justify-around items-center h-16"><a class="flex flex-col items-center gap-1 text-primary" href="#"><span class="material-symbols-outlined">point_of_sale</span><span class="text-[12px] font-label-bold">Bán hàng</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant" href="#"><span class="material-symbols-outlined">inventory_2</span><span class="text-[12px] font-label-bold">Sơ đồ/Kho</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant" href="#"><span class="material-symbols-outlined">receipt</span><span class="text-[12px] font-label-bold">Hóa đơn</span></a><a class="flex flex-col items-center gap-1 text-on-surface-variant" href="#"><span class="material-symbols-outlined">bar_chart</span><span class="text-[12px] font-label-bold">Báo cáo</span></a></div></nav>
<!-- Spacer for sticky footer -->
<div class="h-[100px]"></div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const TOTAL_AMOUNT = 285000;
            let currentCash = 300000;
            
            const cashInput = document.getElementById('cash-input');
            const changeDisplay = document.getElementById('change-display');
            const quickBtns = document.querySelectorAll('.quick-btn');
            const paymentBtns = document.querySelectorAll('.payment-method-btn');
            const cashSection = document.getElementById('cash-input-section');
            const completeBtn = document.getElementById('complete-btn');

            // Format currency helper
            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('vi-VN').format(amount);
            };

            const parseCurrency = (str) => {
                return parseInt(str.replace(/\D/g, ''), 10) || 0;
            };

            const updateCalculations = () => {
                const diff = currentCash - TOTAL_AMOUNT;
                
                if (diff >= 0) {
                    changeDisplay.textContent = `${formatCurrency(diff)} đ`;
                    changeDisplay.classList.remove('text-error');
                    changeDisplay.classList.add('text-on-tertiary-fixed');
                    completeBtn.disabled = false;
                    completeBtn.classList.remove('opacity-50', 'bg-outline-variant');
                    completeBtn.classList.add('bg-secondary');
                } else {
                    changeDisplay.textContent = `Thiếu ${formatCurrency(Math.abs(diff))} đ`;
                    changeDisplay.classList.remove('text-on-tertiary-fixed');
                    changeDisplay.classList.add('text-error');
                    completeBtn.disabled = true;
                    completeBtn.classList.add('opacity-50', 'bg-outline-variant');
                    completeBtn.classList.remove('bg-secondary');
                }
            };

            // Input handling
            cashInput.addEventListener('input', (e) => {
                let val = parseCurrency(e.target.value);
                currentCash = val;
                e.target.value = val > 0 ? formatCurrency(val) : '';
                updateCalculations();
            });

            // Quick amounts
            quickBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Visual feedback
                    quickBtns.forEach(b => b.classList.replace('bg-primary-container', 'bg-surface-container-high'));
                    quickBtns.forEach(b => b.classList.replace('text-on-primary-container', 'text-on-surface'));
                    e.target.classList.replace('bg-surface-container-high', 'bg-primary-container');
                    e.target.classList.replace('text-on-surface', 'text-on-primary-container');
                    
                    const val = parseInt(e.target.dataset.val, 10);
                    currentCash = val;
                    cashInput.value = formatCurrency(val);
                    updateCalculations();
                });
            });

            // Payment method toggle
            paymentBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const method = e.currentTarget.dataset.method;
                    
                    // Reset all buttons
                    paymentBtns.forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container');
                        b.classList.add('bg-surface-container', 'text-on-surface-variant');
                        const icon = b.querySelector('.material-symbols-outlined');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Set active button
                    e.currentTarget.classList.remove('bg-surface-container', 'text-on-surface-variant');
                    e.currentTarget.classList.add('bg-primary-container', 'text-on-primary-container');
                    const activeIcon = e.currentTarget.querySelector('.material-symbols-outlined');
                    activeIcon.style.fontVariationSettings = "'FILL' 1";

                    // Add pulse effect
                    e.currentTarget.style.transform = 'scale(0.95)';
                    setTimeout(() => e.currentTarget.style.transform = 'scale(1)', 150);

                    // Show/Hide cash section
                    if (method === 'cash') {
                        cashSection.style.opacity = '1';
                        cashSection.style.height = 'auto';
                        cashSection.style.pointerEvents = 'auto';
                        cashSection.classList.remove('scale-y-0', 'mb-[-200px]');
                        updateCalculations(); // Ensure valid state for cash
                    } else {
                        cashSection.style.opacity = '0';
                        cashSection.classList.add('scale-y-0', 'mb-[-200px]');
                        cashSection.style.pointerEvents = 'none';
                        // Auto-enable complete for non-cash
                        completeBtn.disabled = false;
                        completeBtn.classList.remove('opacity-50', 'bg-outline-variant');
                        completeBtn.classList.add('bg-secondary');
                    }
                });
            });

            // Complete animation
            completeBtn.addEventListener('click', function(e) {
                if(this.disabled) return;
                
                const icon = this.querySelector('.material-symbols-outlined');
                icon.textContent = 'hourglass_empty';
                icon.classList.add('animate-spin');
                this.classList.add('opacity-90');
                
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    icon.textContent = 'done_all';
                    this.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">done_all</span> Đã thanh toán`;
                    this.classList.replace('bg-secondary', 'bg-secondary-container');
                    this.classList.replace('text-on-secondary', 'text-on-secondary-container');
                }, 1000);
            });
        });
    </script>
</div></main></body></html>

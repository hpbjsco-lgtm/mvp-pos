# Database server + web app.
#   1. Copy deploy/docker.env.example to .env and fill in the two tokens.
#   2. docker compose up -d --build
# The SQLite file is stored in POS_DATA_DIR on the host, outside the image, so rebuilding never touches it.
services:
  pos:
    build:
      context: .
      args:
        # Fixed into the web bundle so the app connects to this server without a settings screen.
        # The two routes are built from POS_DOMAIN_URL and POS_LAN_ADDRESS (+ POS_PORT), so each is written once in .env.
        VITE_SERVER_DOMAIN_URL: ${POS_DOMAIN_URL:-}
        VITE_SERVER_LOCAL_URL: ${POS_LAN_ADDRESS:+http://${POS_LAN_ADDRESS}:${POS_PORT:-8790}}
        VITE_SERVER_API_TOKEN: ${API_TOKEN}
    image: mvp-pos:latest
    container_name: mvp-pos
    restart: unless-stopped
    ports:
      # By default only the local machine can reach the container (Apache is the public entry point).
      # Set POS_BIND_ADDRESS=0.0.0.0 to let devices in the shop network connect too (needed when POS_LAN_ADDRESS is set).
      - "${POS_BIND_ADDRESS:-127.0.0.1}:${POS_PORT:-8790}:8790"
    environment:
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # Scheduled backups into <POS_DATA_DIR>/backups; empty values use the defaults (every 24 hours, keep 14).
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      # Origins allowed to call the API from another address: the web app opened at the LAN address, the web app
      # at the domain, and the phone apps (Android https://localhost, iOS capacitor://localhost).
      CORS_ORIGIN: ${POS_LAN_ADDRESS:+http://${POS_LAN_ADDRESS}:${POS_PORT:-8790},}${POS_DOMAIN_URL:+${POS_DOMAIN_URL},}https://localhost,capacitor://localhost
    volumes:
      - ${POS_DATA_DIR:-./data}:/data
